test-email-verification:
  post:
    operationId: testEmailVerification
    description: Test email verification workflow
    summary: "(public) Test email verification"
    tags: [Tests]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
                example: dev@example.com
          example:
            email: dev@example.com
    responses:
      '200':
        description: Verification simulation triggered
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
            examples:
              SuccessTrigger:
                summary: Simulation Triggered
                value:
                  message: Simulation email verification for dev@example.com has been sent.

test-orders:
  post:
    operationId: testOrder
    description: Create a dummy order for testing. Requires authentication and user permission.
    summary: "(user) Test order"
    tags: [Tests]
    security:
      - BearerAuth: []
    responses:
      '201':
        description: Order created
        content:
          application/json:
            schema:
              type: object
              required: [message, data]
              properties:
                message:
                  type: string
                data:
                  type: object
            examples:
              OrderCreated:
                summary: Order Created Successfully
                value:
                  message: "Order created successfully."
                  data:
                    orderId: "ORD-TEST-123"
                    status: "pending"
      '403':
        description: Forbidden - Requires user permission
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              MissingPermission:
                summary: Missing 'user' Permission
                value:
                  message: "Forbidden: You do not have permission 'user'."
                  requestId: req-test-403

test-admin:
  get:
    operationId: testAdminAccess
    description: Test admin access level. Requires authentication and admin permission.
    summary: "(admin) Test admin access"
    tags: [Tests]
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Access granted
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
            examples:
              AdminAccess:
                summary: Admin Access Granted
                value:
                  message: "Welcome Admin! Access granted."
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotAnAdmin:
                summary: "Access Denied: Not Admin"
                value:
                  message: "Access denied: admin role required."
                  requestId: req-admin-403

