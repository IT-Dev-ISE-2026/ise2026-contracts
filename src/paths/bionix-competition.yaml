                      limit: 10
                  message: "List of registrations retrieved successfully."
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Unauthorized
                value:
                  message: "Unauthorized access."
                  requestId: req-bionix-list-401
      '403':
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Forbidden
                value:
                  message: "Insufficient permissions."
                  requestId: req-bionix-list-403
  post:
    operationId: submitBionixRegistration
    summary: "(user) Submit Bionix Competition registration"
    description: "[user] Register a team for the Bionix Competition. Requires authenticated user. All file paths must start with temp/."
    tags: ["Events/Bionix Competition"]

    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiBionixCompetitionRegistrationRequest.yaml'
    responses:
      '201':
        description: Registration submitted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  properties:
                    registration:
                      $ref: '../components/schemas/ApiBionixCompetitionRegistrationResponse.yaml'
                    payment:
                      type: object
                      properties:
                        orderId:
                          type: string
                          format: uuid
                        amount:
                          type: integer
                          description: "Amount to be paid for this sequence (in IDR)."
                        sequence:
                          type: integer
                          description: "Payment sequence (1 for DP, 2 for pelunasan, etc.)"
                        paymentDeadline:
                          type: string
                          format: date-time
                        snapToken:
                          type: string
                        redirectUrl:
                          type: string
                message:
                  type: string
                  example: "Registration submitted successfully."
            examples:
              RegistrationSuccess:
                summary: Successful Registration
                value:
                  data:
                    registration:
                      id: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                      userId: "6de1e466-24ba-4475-8495-2aa73b5bd5fb"
                      teamName: "Hengker Keputih"
