check-team:
  get:
    operationId: checkBionixTeamName
    summary: "(user) Check team name availability"
    description: "[user] Check if a team name is already taken for Bionix Competition."
    tags: ["Events/Bionix Competition"]

    security:
      - BearerAuth: []
    parameters:
      - name: name
        in: query
        required: true
        description: Team name to check.
        schema:
          type: string
          minLength: 3
    responses:
      '200':
        description: Availability status retrieved.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [isAvailable]
                  properties:
                    isAvailable:
                      type: boolean
                      example: true
            examples:
              Available:
                summary: Team Name Available
                value:
                  data:
                    isAvailable: true
              Taken:
                summary: Team Name Already Taken
                value:
                  data:
                    isAvailable: false
      '401':
        description: Unauthorized. Invalid or missing access token.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Token Missing or Invalid
                value:
                  message: "Unauthorized access."
                  requestId: "req-bionix-check-401"

