registrations:
  get:
    operationId: listBionixRegistrations
    summary: "(admin) List all Bionix Competition registrations"
    description: "Retrieve a list of all Bionix Competition registrations. Requires admin permissions."
    tags: ["Events/Bionix Competition"]
    security:
      - BearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number to retrieve.
        schema:
          type: integer
          default: 1
          example: 1
      - name: limit
        in: query
        description: Number of items per page.
        schema:
          type: integer
          default: 10
          example: 10
      - name: search
        in: query
        description: Search by team name, leader name, or school name.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by registration status.
        schema:
          type: string
          enum: [pending_payment, pending_review, revision_requested, verified, rejected]
      - name: stage
        in: query
        description: Filter by competition stage.
        schema:
          type: string
          enum: [penyisihan, semifinal, final]
    responses:
      '200':
        description: List of registrations retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  required: [items, meta]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '../components/schemas/ApiBionixCompetitionRegistrationResponse.yaml'
                    meta:
                      $ref: '../components/schemas/ApiPaginationMeta.yaml'
                message:
                  type: string
            examples:
              SuccessRetrieval:
                summary: Success
                value:
                  data:
                    items:
                      - id: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                        userId: "6de1e466-24ba-4475-8495-2aa73b5bd5fb"
                        teamName: "Hengker Keputih"
                        schoolName: "SMA Negeri 1 Surabaya"
                        isAgreed: true
                        leaderName: "Andi"
                        leaderCityId: 1
                        leaderGrade: "grade_12"
