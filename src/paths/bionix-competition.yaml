registrations:
  post:
    operationId: submitBionixRegistration
    summary: Submit Bionix Competition registration
    description: "[user] Register a team for the Bionix Competition. Requires authenticated user. All file paths must start with temp/."
    tags: ["Events/Bionix Competition"]

    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiBionixCompetitionRegistrationRequest.yaml'
    responses:
      '201':
        description: Registration submitted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  properties:
                    registration:
                      $ref: '../components/schemas/ApiBionixCompetitionRegistrationResponse.yaml'
                    payment:
                      type: object
                      properties:
                        snapToken:
                          type: string
                        redirectUrl:
                          type: string
                message:
                  type: string
                  example: "Registration submitted successfully."
            examples:
              RegistrationSuccess:
                summary: Successful Registration
                value:
                  data:
                    registration:
                      id: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                      userId: "6de1e466-24ba-4475-8495-2aa73b5bd5fb"
                      teamName: "Hengker Keputih"
                      schoolName: "SMA Negeri 1 Surabaya"
                      isAgreed: true
                      leaderName: "Andi"
                      leaderCityId: 1
                      leaderGrade: "grade_12"
                      leaderEmail: "andi@gmail.com"
                      leaderPhone: "08123456789"
                      leaderStudentCardUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/id/ktp.jpg?..."
                      leaderPosterProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/poster-proof/p.jpg?..."
                      leaderInstagramProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/instagram-proof/i.jpg?..."
                      leaderTiktokProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/tiktok-proof/t.jpg?..."
                      leaderTwibbonProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/twibbon-proof/t.jpg?..."
                      memberName: "Budi"
                      memberCityId: 1
                      memberGrade: "grade_12"
                      memberEmail: "budi@gmail.com"
                      memberPhone: "08123456780"
                      memberStudentCardUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/id/ktp.jpg?..."
                      memberPosterProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/poster-proof/p.jpg?..."
                      memberInstagramProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/instagram-proof/i.jpg?..."
                      memberTiktokProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/tiktok-proof/t.jpg?..."
                      memberTwibbonProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/twibbon-proof/t.jpg?..."
                      status: "pending_payment"
                      stage: null
                      createdAt: "2026-05-16T08:00:00Z"
                      updatedAt: "2026-05-16T08:00:00Z"
                    payment:
                      snapToken: "8687a100-84a1-42cb-b72e-d00922849568"
                      redirectUrl: "https://app.sandbox.midtrans.com/snap/v2/vtweb/8687a100-84a1-42cb-b72e-d00922849568"
                  message: "Registration submitted successfully."
      '400':
        description: Bad request. Syntax error or invalid format.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              BadRequest:
                summary: Bad Request
                value:
                  message: "Invalid request format."
                  requestId: "req-bionix-sub-400"
      '422':
        description: Unprocessable Entity. Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              ValidationError:
                summary: Validation Failed
                value:
                  message: "Validation failed."
                  requestId: "req-bionix-sub-422"
                  errors:
                    teamName: ["teamName is a required field"]
                    isAgreed: ["isAgreed must be true"]

      '401':
        description: Unauthorized. Invalid or missing access token.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Token Missing
                value:
                  message: "Unauthorized access."
                  requestId: "req-bionix-sub-401"
      '409':
        description: Conflict. Team name, email, or phone already registered.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              TeamNameTaken:
                summary: Team Name Already Exists
                value:
                  message: "Team name is already taken. Please choose another team name."
                  requestId: "req-bionix-sub-409"

registrations-draft:
  put:
    operationId: saveBionixDraft
    summary: Save Bionix registration draft
    description: "[user] Save or overwrite a draft of the Bionix Competition registration form. All fields are optional. File paths must start with temp/."
    tags: ["Events/Bionix Competition"]

    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiBionixCompetitionRegistrationDraftRequest.yaml'
    responses:
      '200':
        description: Draft saved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  $ref: '../components/schemas/ApiBionixCompetitionRegistrationDraftResponse.yaml'
                message:
                  type: string
                  example: "Draft saved successfully."
            examples:
              DraftPartialSuccess:
                summary: Partial Draft Saved
                value:
                  data:
                    teamName: "Hengker Keputih"
                    updatedAt: "2026-05-16T09:00:00Z"
                  message: "Draft saved successfully."
      '401':
        description: Unauthorized. Invalid or missing access token.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Token Missing or Invalid
                value:
                  message: "Unauthorized access."
                  requestId: "req-bionix-draft-401"
      '422':
        description: Unprocessable Entity. Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              ValidationError:
                summary: Validation Failed
                value:
                  message: "Validation failed."
                  requestId: "req-bionix-draft-422"
                  errors:
                    leaderEmail: ["leaderEmail must be a valid email"]

  get:
    operationId: getMyBionixDraft
    summary: Get current user's Bionix draft
    description: "[user] Retrieve the autosaved Bionix registration draft."
    tags: ["Events/Bionix Competition"]

    security:
      - BearerAuth: []
    responses:
      '200':
        description: Draft retrieved.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  $ref: '../components/schemas/ApiBionixCompetitionRegistrationDraftResponse.yaml'
                message:
                  type: string
            examples:
              DraftFound:
                summary: Draft Found
                value:
                  data:
                    teamName: "Hengker Keputih"
                    leaderStudentCardUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/temp/id.jpg?..."
                  message: "Draft retrieved successfully."

      '404':
        description: Draft not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Draft Not Found
                value:
                  message: "You don't have any saved draft for Bionix Competition."
                  requestId: "req-bionix-draft-404"

