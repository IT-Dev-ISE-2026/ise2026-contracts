                        leaderTiktokProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/tiktok-proof/t.jpg"
                        leaderTwibbonProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/twibbon-proof/t.jpg"
                        memberName: "Budi"
                        memberCityId: 1
                        memberGrade: "grade_12"
                        memberEmail: "budi@gmail.com"
                        memberPhone: "08123456780"
                        memberStudentCardUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/id/ktp.jpg"
                        memberPosterProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/poster-proof/p.jpg"
                        memberInstagramProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/instagram-proof/i.jpg"
                        memberTiktokProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/tiktok-proof/t.jpg"
                        memberTwibbonProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix/ade1e466/twibbon-proof/t.jpg"
                        status: "pending_payment"
