finish:
  post:
    operationId: postTerritoryClashFinish
    summary: "(operator) Finish game and persist results"
    description: "[operator] Lock board interaction, calculate Bingo bonus points (5 horizontal = +75, 4 horizontal = +45, 3 h/v/d = +15; a horizontal run only scores its longest pattern, no double counting), persist session snapshot and team bonus points to PostgreSQL (idempotent per sessionId), then keep the session in Redis marked as finished so GET /session keeps returning the final result until a new game is started via reset. Requires operator:territory-clash:* permission."
    tags: [Territory Clash]
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Territory clash game finished successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  $ref: '../components/schemas/ApiTerritoryClashFinishResponse.yaml'
                message:
                  type: string
                  example: "Territory clash game finished successfully."
