registrations:
  get:
    operationId: listBionixIsClassRegistrations
    summary: "(admin) List all Bionix IS Class registrations"
    description: "[admin] Retrieve a list of all Bionix IS Class registrations. Requires admin permissions."
    tags: ["Events/Bionix IS Class"]
    security:
      - BearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number to retrieve.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: Number of items per page.
        schema:
          type: integer
          default: 10
      - name: search
        in: query
        description: Search by name or email.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by registration status.
        schema:
          type: string
          enum: [pending_payment, pending_review, revision_requested, verified, rejected]
    responses:
      '200':
        description: List of registrations retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  required: [items, meta]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '../components/schemas/ApiBionixIsClassRegistrationResponse.yaml'
                    meta:
                      $ref: '../components/schemas/ApiPaginationMeta.yaml'
                message:
                  type: string
            examples:
              SuccessRetrieval:
                summary: Success
                value:
                  data:
                    items:
                      - id: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                        userId: "6de1e466-24ba-4475-8495-2aa73b5bd5fb"
                        name: "Andi"
                        gender: "male"
                        cityId: 1
                        schoolName: "SMA Negeri 1 Surabaya"
                        grade: "grade_12"
                        studentCardUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/id/ktp.jpg"
                        posterProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/poster/p.jpg"
                        instagramProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/ig/i.jpg"
                        tiktokProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/tt/t.jpg"
                        twibbonProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/tw/t.jpg"
                        isAgreed: true
                        status: "pending_payment"
                        createdAt: "2026-05-16T08:00:00Z"
                        updatedAt: "2026-05-16T08:00:00Z"
                    meta:
                      totalItems: 1
                      totalPages: 1
                      currentPage: 1
                      limit: 10
                  message: "List of registrations retrieved successfully."
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Unauthorized
                value:
                  message: "Unauthorized access."
                  requestId: req-bionix-is-class-list-401
      '403':
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Forbidden
                value:
                  message: "Insufficient permissions."
                  requestId: req-bionix-is-class-list-403
  post:
    operationId: submitBionixIsClassRegistration
    summary: "(user) Submit Bionix IS Class registration"
    description: "[user] Register for Bionix IS Class. Requires authenticated user. All file paths must start with temp/."
    tags: ["Events/Bionix IS Class"]

    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiBionixIsClassRegistrationRequest.yaml'
    responses:
      '201':
        description: Registration submitted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  properties:
                    registration:
                      $ref: '../components/schemas/ApiBionixIsClassRegistrationResponse.yaml'
                    payment:
                      type: object
                      properties:
                        amount:
                          type: integer
                          description: "Amount to be paid for this sequence (in IDR)."
                        sequence:
                          type: integer
                          description: "Payment sequence (1 for DP, 2 for pelunasan, etc.)"
                        paymentDeadline:
                          type: string
                          format: date-time
                        snapToken:
                          type: string
                        redirectUrl:
                          type: string
                message:
                  type: string
                  example: "Registration submitted successfully."
            examples:
              RegistrationSuccess:
                summary: Successful Registration
                value:
                  data:
                    registration:
                      id: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                      userId: "6de1e466-24ba-4475-8495-2aa73b5bd5fb"
                      name: "Andi"
                      gender: "male"
                      cityId: 1
                      schoolName: "SMA Negeri 1 Surabaya"
                      grade: "grade_12"
                      studentCardUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/id/ktp.jpg?..."
                      posterProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/poster/p.jpg?..."
                      instagramProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/ig/i.jpg?..."
                      tiktokProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/tt/t.jpg?..."
                      twibbonProofUrl: "https://s3.ap-southeast-1.amazonaws.com/ise-bucket/bionix-is-class/tw/t.jpg?..."
                      isAgreed: true
                      status: "pending_payment"
                      createdAt: "2026-05-16T08:00:00Z"
                      updatedAt: "2026-05-16T08:00:00Z"
                    payment:
                      amount: 50000
                      sequence: 1
                      paymentDeadline: "2026-05-17T08:00:00Z"
                      snapToken: "8687a100-84a1-42cb-b72e-d00922849568"
                      redirectUrl: "https://app.sandbox.midtrans.com/snap/v2/vtweb/8687a100-84a1-42cb-b72e-d00922849568"
                  message: "Registration submitted successfully."
      '400':
        description: Bad request. Syntax error or invalid format.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              BadRequest:
                summary: Bad Request
                value:
                  message: "Invalid request format."
                  requestId: "req-bionix-is-class-sub-400"
      '422':
        description: Unprocessable Entity. Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              ValidationError:
                summary: Validation Failed
                value:
                  message: "Validation failed."
                  requestId: "req-bionix-is-class-sub-422"
                  errors:
                    isAgreed: ["isAgreed must be true"]
      '401':
        description: Unauthorized. Invalid or missing access token.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Token Missing
                value:
                  message: "Unauthorized access."
                  requestId: "req-bionix-is-class-sub-401"

