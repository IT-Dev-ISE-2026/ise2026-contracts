ping:
  get:
    operationId: sysPing
    description: Endpoint for connectivity check
    summary: Ping for connectivity check
    tags: [System]
    responses:
      '200':
        description: Pong response
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [message]
                  properties:
                    message:
                      type: string
                      example: pong
            example:
              data:
                message: pong

health:
  get:
    operationId: sysHealth
    description: Endpoint for health check
    summary: Health check
    tags: [System]
    responses:
      '200':
        description: Service healthy
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [status]
                  properties:
                    status:
                      type: string
                      example: healthy
            example:
              data:
                status: healthy

      '503':
        description: Service unhealthy
        content:
          application/json:
            schema:
              $ref: '../components/schemas/error.yaml'
            example:
              message: Service unhealthy
              requestId: req-sys-123
              errors:
                database: ["connection failed"]
