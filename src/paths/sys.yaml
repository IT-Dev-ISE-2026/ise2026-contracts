ping:
  get:
    operationId: sysPing
    description: Endpoint for connectivity check
    summary: "(public) Ping for connectivity check"
    tags: [System]
    responses:
      '200':
        description: Pong response
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [message]
                  properties:
                    message:
                      type: string
                      example: "Pong."
            examples:
              StandardPong:
                summary: Standard Pong Response
                value:
                  data:
                    message: "Pong."

health:
  get:
    operationId: sysHealth
    description: Endpoint for health check
    summary: "(public) Health check"
    tags: [System]
    responses:
      '200':
        description: Service healthy
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [status]
                  properties:
                    status:
                      type: string
                      example: "Healthy."
            examples:
              ServiceHealthy:
                summary: All Systems Operational
                value:
                  data:
                    status: "Healthy."

      '503':
        description: Service unhealthy
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              DatabaseDown:
                summary: Database Connection Error
                value:
                  message: "Service unhealthy."
                  requestId: req-sys-db-down
                  errors:
                    database: ["connection failed", "timeout after 5s"]
              RedisDown:
                summary: Redis Connection Error
                value:
                  message: "Service unhealthy."
                  requestId: req-sys-redis-down
                  errors:
                    redis: ["dial tcp [::1]:6379: connect: connection refused"]

set-permissions:
  post:
    operationId: setPermissions
    description: Internal tool to manually update user permissions. Requires X-Internal-Token header.
    summary: "(internal) Set user permissions"
    tags: [Internal]
    parameters:
      - in: header
        name: X-Internal-Token
        required: true
        schema:
          type: string
        description: Secret token for internal access.
      - in: query
        name: email
        required: true
        schema:
          type: string
          format: email
        description: User email to update permissions for.
        example: dev@example.com
      - in: query
        name: permissions
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '../components/schemas/ApiPermission.yaml'
        description: List of permissions to assign.
        example: ["admin", "user"]
    responses:
      '200':
        description: Permissions updated successfully
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "User permissions updated successfully."
            examples:
              UpdateSuccess:
                summary: Permission Update Successful
                value:
                  message: "User permissions updated successfully."
      '401':
        description: Unauthorized - Invalid or missing internal token
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              InvalidToken:
                summary: Invalid Internal Token
                value:
                  message: "Invalid credentials."
                  requestId: internal-req-123
      '500':
        description: Failed to update permissions
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              UserNotFound:
                summary: User Not Found
                value:
                  message: "Failed to update user permissions: User not found."
                  requestId: internal-req-456

list-cities:
  get:
    operationId: listCities
    summary: "(public) Get list of cities"
    description: "Get master data of cities for registration forms. No authentication required."
    tags: [System]
    parameters:
      - name: search
        in: query
        description: Search by city name.
        schema:
          type: string
    responses:
      '200':
        description: List of cities retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/ApiCity.yaml'
            examples:
              CityList:
                summary: Sample City List
                value:
                  data:
                    - id: 1
                      name: "Surabaya"
                    - id: 2
                      name: "Jakarta Selatan"
