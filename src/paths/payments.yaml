webhook:
  post:
    tags:
      - Payments
    summary: Midtrans Payment Webhook
    description: Receives notification callback from Midtrans regarding payment status updates.
    operationId: processPaymentWebhook
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Arbitrary Midtrans JSON payload containing order_id, transaction_status, etc.
    responses:
      '200':
        description: Webhook processed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string

sync:
  post:
    tags:
      - Payments
    summary: Manual Payment Sync
    description: Manually triggers a synchronization of the payment status with Midtrans API for a specific order.
    operationId: syncPaymentStatus
    security:
      - BearerAuth: []
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the order to sync.
    responses:
      '200':
        description: Payment synced successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                status:
                  type: string
                  description: The new payment status.
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
      '403':
        description: Forbidden.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
      '404':
        description: Order not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'

active:
  post:
    tags:
      - Payments
    summary: Ensure Active Payment
    description: Returns the active Midtrans Snap transaction for an unpaid order, or creates a replacement transaction when none is active.
    operationId: ensureActivePayment
    security:
      - BearerAuth: []
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the order that needs an active payment transaction.
    responses:
      '200':
        description: Active payment transaction is available.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    orderId:
                      type: string
                      format: uuid
                    finalPrice:
                      type: integer
                    midtransOrderId:
                      type: string
                    snapToken:
                      type: string
                    redirectUrl:
                      type: string
                      nullable: true
                    amount:
                      type: integer
                    sequence:
                      type: integer
                    paymentDeadline:
                      type: string
                      format: date-time
                      nullable: true
                    status:
                      type: string
                  required:
                    - orderId
                    - finalPrice
                    - midtransOrderId
                    - snapToken
                    - amount
                    - sequence
                    - status
              required:
                - data
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
      '403':
        description: Forbidden.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
      '404':
        description: Order not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
      '409':
        description: Order is already paid.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
