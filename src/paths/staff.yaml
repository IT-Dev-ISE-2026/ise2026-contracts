get-staff-by-id:
  get:
    operationId: getStaffById
    description: Get staff registration data by ID. Returns staff details if found.
    summary: Get staff by ID
    tags: [Staff]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Data ditemukan
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [id, name, prodi, isAccepted, dresscode]
                  properties:
                    id:
                      type: number
                      example: 1
                    name:
                      type: string
                      example: John Doe
                    nrp:
                      type: string
                      example: "1234567890"
                    isAccepted:
                      type: boolean
                      example: true
                    dresscode:
                      type: string
                      nullable: true
                      example: White Shirt
            example:
              data:
                id: 1234567890
                name: John Doe
                nrp: "1234567890"
                isAccepted: true
                dresscode: White Shirt
      '404':
        description: Data tidak ditemukan
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [message, requestId]
                  properties:
                    message:
                      type: string
                      example: Data registrasi staff tidak ditemukan
                    requestId:
                      type: string
                      example: abc123
            example:
              data:
                message: Data registrasi staff tidak ditemukan
                requestId: abc123


