get-staff-by-id:
  get:
    operationId: getStaffById
    description: Get staff registration data by ID. Returns staff details if found.
    summary: Get staff by ID
    tags: [Staff]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: "5025211001"
        description: Staff ID or identifier.
    responses:
      '200':
        description: Staff data found
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [id, name, isAccepted, dresscode]
                  properties:
                    id:
                      type: string
                      example: "1"
                    name:
                      type: string
                      example: John Doe
                    isAccepted:
                      type: boolean
                      example: true
                    dresscode:
                      type: string
                      nullable: true
                      example: White Shirt
            examples:
              StaffAccepted:
                summary: Staff data - Accepted
                value:
                  data:
                    id: "STF-2026-001"
                    name: John Doe
                    isAccepted: true
                    dresscode: "White Shirt & Black Pants"
              StaffRejected:
                summary: Staff data - Rejected
                value:
                  data:
                    id: "STF-2026-999"
                    name: Jane Smith
                    isAccepted: false
                    dresscode: null
      '404':
        description: Staff data not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Staff not found
                value:
                  message: "Staff registration data not found."
                  requestId: abc123
                  errors:
                    id: ["invalid staff id format or not found"]
      '400':
        description: Bad request.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              BadRequest:
                summary: Bad request
                value:
                  message: "Bad request."
                  requestId: req-bad-staff
