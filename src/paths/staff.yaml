get-staff-by-id:
  get:
    operationId: getStaffById
    description: Get staff registration data by ID. Returns staff details if found.
    summary: Get staff by ID
    tags: [Staff]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: "1"
        description: Staff ID or identifier.
    responses:
      '200':
        description: Staff data found
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [id, name, prodi, isAccepted, dresscode]
                  properties:
                    id:
                      type: string
                      example: "1"
                    name:
                      type: string
                      example: John Doe
                    prodi:
                      type: string
                      example: "Informatika"
                    isAccepted:
                      type: boolean
                      example: true
                    dresscode:
                      type: string
                      nullable: true
                      example: White Shirt
            examples:
              StaffAccepted:
                summary: Data staff yang dinyatakan diterima
                value:
                  data:
                    id: "STF-2026-001"
                    name: John Doe
                    prodi: "Informatika"
                    isAccepted: true
                    dresscode: "White Shirt & Black Pants"
              StaffRejected:
                summary: Data staff yang tidak lolos seleksi
                value:
                  data:
                    id: "STF-2026-999"
                    name: Jane Smith
                    prodi: "Sistem Informasi"
                    isAccepted: false
                    dresscode: null
      '404':
        description: Staff data not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/error.yaml'
            examples:
              NotFound:
                summary: ID staff tidak terdaftar
                value:
                  message: Staff registration data not found
                  requestId: abc123
                  errors:
                    id: ["invalid staff id format or not found"]
