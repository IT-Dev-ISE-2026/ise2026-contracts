get-event-by-slug:
  get:
    operationId: getEventBySlug
    description: Get event details including its timelines by event slug.
    summary: Get event by slug
    tags: [Events]
    security: []
    parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
        description: The slug of the event (e.g., bionix, rise)
    responses:
      "200":
        description: Event details found
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/ApiEvent.yaml'
            examples:
              SuccessBionix:
                summary: Bionix event details
                value:
                  data:
                    id: 1
                    slug: "bionix"
                    name: "Bionix"
                    price: 0
                    isActive: true
                    timelines:
                      - id: 1
                        name: "IS Class Registration"
                        date: "2026-05-01T00:00:00Z"
                        sequenceOrder: 1
                      - id: 2
                        name: "Bionix Competition Registration"
                        date: "2026-06-01T00:00:00Z"
                        sequenceOrder: 2
                      - id: 3
                        name: "IS Class Starts"
                        date: "2026-08-01T00:00:00Z"
                        sequenceOrder: 3
                      - id: 4 
                        name: "Try Out 1"
                        date: "2026-09-01T00:00:00Z"
                        sequenceOrder: 4
                      - id: 5
                        name: "Try Out 2"
                        date: "2026-10-01T00:00:00Z"
                        sequenceOrder: 5
                      - id: 6
                        name: "Bionix Competition Penyisihan"
                        date: "2026-11-01T00:00:00Z"
                        sequenceOrder: 6
                      - id: 7
                        name: "Bionix Competition Semifinal"
                        date: "2026-12-01T00:00:00Z"
                        sequenceOrder: 7
                      - id: 8
                        name: "Bionix Competition Grand Final"
                        date: "2027-01-01T00:00:00Z"
                        sequenceOrder: 8
                    links: []
                    subEvents:
                      - id: 2
                        slug: "bionix-competition"
                        name: "Bionix Competition"
                        price: 100000
                        isActive: true
                        links:
                          - id: 1
                            name: "Guidebook Bionix Competition"
                            url: "https://ise-its.com/guidebook-bionix"
                            slug: "bionix-competition-guidebook"
                        timelines: []
                      - id: 3
                        slug: "bionix-is-class"
                        name: "Bionix IS Class"
                        price: 100000
                        isActive: true
                        links:
                          - id: 1
                            name: "Guidebook Bionix IS Class"
                            url: "https://ise-its.com/guidebook-bionix-is-class"
                            slug: "bionix-is-class-guidebook"
                        timelines: []
      "404":
        description: Event not found
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              EventNotFound:
                summary: Event not found
                value:
                  message: "Event not found."
                  requestId: req-abc123

stats:
  get:
    operationId: getEventStatsBySlug
    description: Get registration statistics for a specific event. Requires `admin:{slug}:read` permission.
    summary: Get event registration statistics
    tags: [Stats]
    security:
      - BearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the event.
        example: bionix-competition
    responses:
      "200":
        description: Returns event registration statistics.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [totalRegistrants]
                  properties:
                    totalRegistrants:
                      type: integer
                      example: 150
            examples:
              SuccessStats:
                summary: Event statistics
                value:
                  data:
                    totalRegistrants: 150
      "404":
        description: Event slug not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Slug not found
                value:
                  message: "event slug not found in statistics"
                  requestId: req-events-stats-404
      "401":
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Unauthorized
                value:
                  message: "Unauthorized access."
                  requestId: req-events-stats-401
      "403":
        description: Forbidden.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Insufficient permissions
                value:
                  message: "Access denied. Insufficient permissions (Requires admin:{slug}:read)."
                  requestId: req-events-stats-403
