stats:
  get:
    operationId: getEventStatsBySlug
    description: Get registration statistics for a specific event. Requires `admin:{slug}:read` permission.
    summary: Get event registration statistics
    tags: [Stats]
    security:
      - BearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the event.
        example: bionix-competition
    responses:
      "200":
        description: Returns event registration statistics.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [totalRegistrants]
                  properties:
                    totalRegistrants:
                      type: integer
                      example: 150
            examples:
              SuccessStats:
                summary: Event statistics
                value:
                  data:
                    totalRegistrants: 150
      "404":
        description: Event slug not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Slug not found
                value:
                  message: "event slug not found in statistics"
                  requestId: req-events-stats-404
      "401":
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Unauthorized
                value:
                  message: "Unauthorized access."
                  requestId: req-events-stats-401
      "403":
        description: Forbidden.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Insufficient permissions
                value:
                  message: "Access denied. Insufficient permissions."
                  requestId: req-events-stats-403

registrations-draft:
  put:
    operationId: saveEventRegistrationDraft
    summary: Save event registration draft
    description: "[user] Save or overwrite a draft of an event registration form. Payload can be any JSON object."
    tags: ["Events"]
    security:
      - BearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          examples:
            DraftPayload:
              summary: Arbitrary JSON data
              value:
                teamName: "Hengker Keputih"
                schoolName: "SMA Negeri 1 Surabaya"
                isAgreed: true
    responses:
      '200':
        description: Draft saved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  additionalProperties: true
                message:
                  type: string
                  example: "Draft saved successfully."
            examples:
              DraftSaved:
                summary: Draft Saved
                value:
                  data:
                    teamName: "Hengker Keputih"
                    schoolName: "SMA Negeri 1 Surabaya"
                    isAgreed: true
                  message: "Draft saved successfully."
  get:
    operationId: getEventRegistrationDraft
    summary: Get event registration draft
    description: "[user] Get a previously saved draft for an event registration."
    tags: ["Events"]
    security:
      - BearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the event.
    responses:
      '200':
        description: Draft retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  additionalProperties: true
                message:
                  type: string
                  example: "Draft retrieved successfully."
            examples:
              DraftRetrieved:
                summary: Draft Retrieved
                value:
                  data:
                    teamName: "Hengker Keputih"
                    schoolName: "SMA Negeri 1 Surabaya"
                    isAgreed: true
                  message: "Draft retrieved successfully."
      '204':
        description: No draft has been saved yet.

registration-reviews:
  get:
    operationId: listRegistrationReviews
    summary: List registration reviews
    description: "[admin] Get the review history for a specific registration."
    tags: ["Events"]
    security:
      - BearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the event.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the registration.
    responses:
      '200':
        description: Registration reviews retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/ApiRegistrationReviewResponse.yaml'
                message:
                  type: string
            examples:
              SuccessRetrieval:
                summary: Success
                value:
                  data:
                    - id: "b123e456-789a-bcde-f012-3456789abcde"
                      registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                      reviewerId: "c789d012-3456-789a-bcde-f01234567890"
                      status: "verified"
                      notes: "Bukti valid dan sesuai."
                      createdAt: "2026-05-24T17:30:00Z"
                  message: "Registration reviews retrieved successfully."
      '404':
        description: Registration not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Registration not found
                value:
                  message: "Registration not found."
                  requestId: req-reviews-404
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Unauthorized
                value:
                  message: "Unauthorized access."
                  requestId: req-reviews-401
      '403':
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Forbidden
                value:
                  message: "Insufficient permissions."
                  requestId: req-reviews-403
  post:
    operationId: submitRegistrationReview
    summary: Submit registration review
    description: "[admin] Submit a new review for a registration, updating its status."
    tags: ["Events"]
    security:
      - BearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the event.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the registration.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiRegistrationReviewRequest.yaml'
    responses:
      '201':
        description: Review submitted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  $ref: '../components/schemas/ApiRegistrationReviewResponse.yaml'
                message:
                  type: string
            examples:
              SuccessSubmission:
                summary: Success
                value:
                  data:
                    id: "b123e456-789a-bcde-f012-3456789abcde"
                    registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                    reviewerId: "c789d012-3456-789a-bcde-f01234567890"
                    status: "verified"
                    notes: "Bukti valid dan sesuai."
                    createdAt: "2026-05-24T17:30:00Z"
                  message: "Review submitted successfully."
      '404':
        description: Registration not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Registration not found
                value:
                  message: "Registration not found."
                  requestId: req-reviews-post-404
      '422':
        description: Unprocessable Entity. Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              ValidationError:
                summary: Validation Error
                value:
                  message: "Invalid status or missing notes."
                  requestId: req-reviews-post-422
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Unauthorized
                value:
                  message: "Unauthorized access."
                  requestId: req-reviews-post-401
      '403':
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Forbidden
                value:
                  message: "Insufficient permissions."
                  requestId: req-reviews-post-403
