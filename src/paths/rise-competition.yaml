  post:
    operationId: submitRiseRegistration
    summary: "(user) Submit Rise Competition registration"
    description: "[user] Register a team for the Rise Competition. Requires authenticated user. All file paths must start with temp/."
    tags: ["Events/Rise Competition"]
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiRiseCompetitionRegistrationRequest.yaml'
    responses:
      '201':
        description: Registration submitted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  properties:
                    registration:
                      $ref: '../components/schemas/ApiRiseCompetitionRegistrationResponse.yaml'
                    payment:
                      type: object
                      properties:
                        orderId:
                          type: string
                          format: uuid
                        amount:
                          type: integer
                        paymentMethod:
                          type: string
                          enum: [qris, bank_transfer]
                        sequence:
                          type: integer
                        paymentDeadline:
                          type: string
                          format: date-time
                        snapToken:
                          type: string
                        redirectUrl:
