registrations-validate:
  post:
    operationId: validateOrderRise
    summary: "(user) Validate Rise registration order"
    description: "[user] Validates the registration payload and returns the calculated order details including base price, voucher discount, service fee, and total. QRIS uses 0.7%; bank transfer uses IDR 4,000. Midtrans VAT of 11% is added to the channel fee, then the result is rounded up to the nearest IDR 1,000."
    tags: ["Events/Rise Competition"]
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiRiseCompetitionRegistrationRequest.yaml'
    responses:
      '200':
        description: Registration payload is valid and order details are calculated.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  required: [orderDetails, paymentMethod, total]
                  properties:
                    orderDetails:
                      type: array
                      items:
                        type: object
                        required: [name, amount]
                        properties:
                          name:
                            type: string
                          amount:
                            type: integer
                    total:
                      type: integer
                    paymentMethod:
                      type: string
                      enum: [qris, bank_transfer]
                message:
                  type: string
            examples:
              SuccessValidation:
                summary: Validation Success
                value:
                  data:
                    paymentMethod: "qris"
                    orderDetails:
                      - name: "Pendaftaran RISE Competition"
                        amount: 100000
                      - name: "Potongan Voucher (KODE)"
                        amount: -10000
                      - name: "Biaya Layanan"
                        amount: 1000
                    total: 91000
                  message: "Validation successful."
      '422':
        description: Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
      '401':
        description: Unauthorized. Invalid or missing access token.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'

