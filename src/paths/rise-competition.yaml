registrations:
  get:
    operationId: listRiseRegistrations
    summary: "(admin) List all Rise Competition registrations"
    description: "[admin] Retrieve a list of all Rise Competition registrations. Requires admin permissions."
    tags: ["Events/Rise Competition"]
    security:
      - BearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number to retrieve.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: Number of items per page.
        schema:
          type: integer
          default: 10
      - name: search
        in: query
        description: Search by team name or leader name.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by registration status.
        schema:
          type: string
          enum: [pending_payment, pending_review, revision_requested, verified, rejected]
      - name: stage
        in: query
        description: Filter by competition stage.
        schema:
          type: string
          enum: [penyisihan, semifinal, final]
    responses:
      '200':
        description: List of registrations retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  type: object
                  required: [items, meta]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '../components/schemas/ApiRiseCompetitionRegistrationResponse.yaml'
                    meta:
                      $ref: '../components/schemas/ApiPaginationMeta.yaml'
                message:
                  type: string
            examples:
              SuccessRetrieval:
