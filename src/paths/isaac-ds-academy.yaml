check-team:
  get:
    operationId: checkIsaacDsTeam
    summary: "(user) Check ISAAC Team"
    description: "[user] Check team details before a member joins by submitting the invitation code."
    tags: ["Events/ISAAC"]
    parameters:
      - name: invitationCode
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Team found and valid.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    teamId:
                      type: string
                      format: uuid
                    teamName:
                      type: string
                    course:
                      type: string
                message:
                  type: string
      '404':
        description: Team not found or code invalid.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              NotFound:
                summary: Team Not Found
                value:
                  message: "Team with the provided invitation code was not found."
                  requestId: req-isaac-check-404

