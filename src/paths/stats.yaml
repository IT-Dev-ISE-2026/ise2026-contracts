users:
  get:
    operationId: getStatsUsers
    description: Get user statistics. Requires `admin:users:read` permission.
    summary: Get user statistics
    tags: [System]
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Returns user statistics.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  properties:
                    total_users:
                      type: integer
                      example: 1000
                    users_by_education_level:
                      type: object
                      additionalProperties:
                        type: integer
                      example:
                        "SMA": 400
                        "Perguruan Tinggi": 600
      "401":
        description: Unauthorized. Invalid or missing access token.
      "403":
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: User does not have admin:users:read permission
                value:
                  message: forbidden
                  requestId: req-xyz-403
