users:
  get:
    operationId: getStatsUsers
    description: Get user statistics. Requires `admin:users:read` permission.
    summary: Get user statistics
    tags: [System]
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Returns user statistics.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  properties:
                    totalAccounts:
                      type: integer
                      example: 15
                    totalUsers:
                      type: integer
                      example: 13
                    totalAdmins:
                      type: integer
                      example: 2
      "401":
        description: Unauthorized. Invalid or missing access token.
      "403":
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: User does not have admin:users:read permission
                value:
                  message: "Access denied. Insufficient permissions."
                  requestId: req-xyz-403
