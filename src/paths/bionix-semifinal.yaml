reset:
  post:
    operationId: resetBionixSemifinal
    summary: "(admin) Reset BIONIX Semifinal round data"
    description: "Reset progress data for a suit or all suits. Retained for internal IT Dev operations (dry runs, testing, simulation). Requires admin permission."
    tags: ["Events/Bionix Competition"]
    security:
      - BearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiBionixSemifinalResetRequest.yaml'
          examples:
            ResetAllSuits:
              summary: Reset all suits and all teams
              value: {}
            ResetSuitOnly:
              summary: Reset all teams for a specific suit
              value:
                suit: "hearts"
            ResetSpecificTeam:
              summary: Reset a single team for a specific suit
              value:
                suit: "hearts"
                registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
    responses:
      '200':
        description: Reset executed successfully.
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "Semifinal data reset successfully."
            examples:
              ResetAllSuitsSuccess:
                summary: All semifinal round data reset
                value:
                  message: "All semifinal round data reset successfully."
              ResetSpecificSuitSuccess:
                summary: Specific suit data reset
                value:
                  message: "Semifinal data for suit 'hearts' reset successfully."
              ResetSpecificTeamSuccess:
                summary: Specific team in a suit reset
                value:
                  message: "Semifinal data for team 'ade1e466-24ba-4475-8495-2aa73b5bd5ff' in suit 'hearts' reset successfully."
      '400':
        description: Bad request.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              BadRequest:
                summary: Bad request
                value:
                  message: "Invalid suit or parameters supplied."
                  requestId: "req-bionix-reset-400"
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Token missing or invalid
                value:
                  message: "Unauthorized access."
                  requestId: "req-bionix-reset-401"
      '403':
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Insufficient permissions
                value:
                  message: "Access denied. Insufficient permissions."
                  requestId: "req-bionix-reset-403"
      '404':
        description: Team not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              RegistrationNotFound:
                summary: Team registration not found
                value:
                  message: "Team registration not found for the specified registrationId."
                  requestId: "req-bionix-reset-404"
      '422':
        description: Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              ValidationError:
                summary: Request body validation failed
                value:
                  message: "Validation failed."
                  requestId: "req-bionix-reset-422"
                  errors:
                    registrationId:
                      - "registrationId must be a valid UUID"
                    suit:
                      - "suit must be one of: hearts, diamonds, clubs, spades"
