action:
  post:
    operationId: submitBionixSemifinalAction
    summary: "(admin) Submit correct or skip action for a team"
    description: "Execute a correct or skip scoring action on the currently active card for a team in a suit. Single-click execution. Enforces Joker 2-lab limit. Requires admin permission."
    tags: ["Events/Bionix Competition"]
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ApiBionixSemifinalActionRequest.yaml'
          examples:
            CorrectAction:
              summary: Submit correct answer on active card
              value:
                registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                suit: "hearts"
                action: "correct"
            SkipAction:
              summary: Submit skip on active card
              value:
                registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                suit: "hearts"
                action: "skip"
    responses:
      '200':
        description: Action executed successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  $ref: '../components/schemas/ApiBionixSemifinalTeamRoundItem.yaml'
                message:
                  type: string
                  example: "Action executed successfully."
            examples:
              CorrectActionSuccess:
                summary: Correct answer recorded (streak +1, base points added)
                value:
                  data:
                    registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                    teamName: "Hengker Keputih"
                    teamLogo: "https://api.dicebear.com/7.x/identicon/svg?seed=team1"
                    orderIndex: 1
                    cardsState: ["correct", "correct", "correct", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending"]
                    currentCardIndex: 3
                    basePoints: 6
                    currentStreak: 3
                    highestStreak: 3
                    streakBonus: 1
                    totalPoints: 7
                    jokerUsed: false
                    jokersUsedTotal: 0
                    isJokerDisabled: false
                    canUndo: true
                    canRedo: false
                  message: "Action executed successfully."
              SkipActionSuccess:
                summary: Skip action recorded (streak resets to 0, advance card)
                value:
                  data:
                    registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                    teamName: "Hengker Keputih"
                    teamLogo: "https://api.dicebear.com/7.x/identicon/svg?seed=team1"
                    orderIndex: 1
                    cardsState: ["correct", "correct", "correct", "skipped", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending"]
                    currentCardIndex: 4
                    basePoints: 6
                    currentStreak: 0
                    highestStreak: 3
                    streakBonus: 1
                    totalPoints: 7
                    jokerUsed: false
                    jokersUsedTotal: 0
                    isJokerDisabled: false
                    canUndo: true
                    canRedo: false
                  message: "Action executed successfully."
              JokerCorrectSuccess:
                summary: Joker card answered correctly (card 14, +9 base points)
                value:
                  data:
                    registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                    teamName: "Hengker Keputih"
                    teamLogo: "https://api.dicebear.com/7.x/identicon/svg?seed=team1"
                    orderIndex: 1
                    cardsState: ["correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct", "correct"]
                    currentCardIndex: 14
                    basePoints: 100
                    currentStreak: 14
                    highestStreak: 14
                    streakBonus: 11
                    totalPoints: 111
                    jokerUsed: true
                    jokersUsedTotal: 2
                    isJokerDisabled: false
                    canUndo: true
                    canRedo: false
                  message: "Action executed successfully."
      '400':
        description: Bad request or rule violation.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              JokerLimitExceeded:
                summary: Joker quota exceeded
                value:
                  message: "Joker quota exceeded. Team has already used Joker in 2 other suits."
                  requestId: "req-bionix-action-400-joker"
              RoundAlreadyCompleted:
                summary: All cards already completed
                value:
                  message: "All 14 cards have already been played for this team in this suit."
                  requestId: "req-bionix-action-400-completed"
              InvalidAction:
                summary: Invalid scoring action
                value:
                  message: "Invalid scoring action specified."
                  requestId: "req-bionix-action-400-invalid"
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Unauthorized:
                summary: Token missing or invalid
                value:
                  message: "Unauthorized access."
                  requestId: "req-bionix-action-401"
      '403':
        description: Forbidden. Insufficient permissions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              Forbidden:
                summary: Insufficient permissions
                value:
                  message: "Access denied. Insufficient permissions."
                  requestId: "req-bionix-action-403"
      '404':
        description: Team or round not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              RegistrationNotFound:
                summary: Team registration not found
                value:
                  message: "Team registration not found or not in semifinal stage."
                  requestId: "req-bionix-action-404"
      '422':
        description: Validation failed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/ApiError.yaml'
            examples:
              ValidationError:
                summary: Request body validation failed
                value:
                  message: "Validation failed."
                  requestId: "req-bionix-action-422"
                  errors:
                    registrationId:
                      - "registrationId must be a valid UUID"
                    suit:
                      - "suit must be one of: hearts, diamonds, clubs, spades"
                    action:
                      - "action must be one of: correct, skip"

