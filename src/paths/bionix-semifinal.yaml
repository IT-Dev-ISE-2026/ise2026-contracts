                        jokersUsedTotal: 2
                        isJokerDisabled: true
                        canUndo: true
                        canRedo: false
                      - registrationId: "cde1e466-24ba-4475-8495-2aa73b5bd5fd"
                        teamName: "Informatika Juara"
