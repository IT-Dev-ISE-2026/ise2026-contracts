round-by-suit:
  get:
    operationId: getBionixSemifinalRound
    summary: "(admin) Get BIONIX Semifinal round state for a suit"
    description: "Retrieve the current state of all 15 competing teams for the specified card suit / lab (hearts, diamonds, clubs, spades). Requires admin permission."
    tags: ["Events/Bionix Competition"]
    security:
      - BearerAuth: []
    parameters:
      - name: suit
        in: path
        required: true
        description: "Card suit / lab category (hearts, diamonds, clubs, spades)."
        schema:
          type: string
          enum: [hearts, diamonds, clubs, spades]
    responses:
      '200':
        description: Round state retrieved successfully.
        content:
          application/json:
            schema:
              type: object
              required: [data, message]
              properties:
                data:
                  $ref: '../components/schemas/ApiBionixSemifinalRoundResponse.yaml'
                message:
                  type: string
                  example: "Round state retrieved successfully."
            examples:
              RoundSuccess:
                summary: Lab round state with competing teams
                value:
                  data:
                    suit: "hearts"
                    teams:
                      - registrationId: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
                        teamName: "Hengker Keputih"
                        teamLogo: "https://api.dicebear.com/7.x/identicon/svg?seed=team1"
                        orderIndex: 1
                        cardsState: ["correct", "correct", "correct", "skipped", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending"]
                        currentCardIndex: 4
                        basePoints: 6
                        currentStreak: 0
                        highestStreak: 3
                        streakBonus: 1
                        totalPoints: 7
                        jokerUsed: false
                        jokersUsedTotal: 1
                        isJokerDisabled: false
                        canUndo: true
                        canRedo: false
                      - registrationId: "bde1e466-24ba-4475-8495-2aa73b5bd5fe"
                        teamName: "Garuda Cyber"
                        teamLogo: "https://api.dicebear.com/7.x/identicon/svg?seed=team2"
                        orderIndex: 2
                        cardsState: ["correct", "correct", "correct", "correct", "correct", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending", "pending"]
