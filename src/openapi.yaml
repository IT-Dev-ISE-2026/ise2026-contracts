openapi: "3.0.3"
info:
  title: ISE 2026 Backend API
  description: Backend API for ISE 2026 — contract-first with oapi-codegen.
  version: '1.23.0'
  contact:
    name: IT Dev ISE!2026 Team
    email: ise.itdev@gmail.com

security: []

tags:
  - name: Auth
    description: Authentication and token management endpoints.
  - name: Staff
    description: Staff-related endpoints.
  - name: System
    description: System check endpoints.
  - name: Stats
    description: Analytical and statistical endpoints.
  - name: Users
    description: User-related endpoints.
  - name: Internal
    description: Internal developer tools.
  - name: Tests
    description: Simulation and tests endpoints.
  - name: Events
    description: Event management and information endpoints.
  - name: Events/Bionix Competition
    description: Registration and management endpoints for Bionix Competition.
  - name: Events/Rise Competition
    description: Registration and management endpoints for Rise Competition.
  - name: Events/Isaac Data Science
    description: Registration and management endpoints for ISAAC Data Science.
  - name: Events/Isaac Digital Product Development
    description: Registration and management endpoints for ISAAC Digital Product Development.
  - name: ShortLinks
    description: URL Shortener management and redirection endpoints.
  - name: Vouchers
    description: Voucher management endpoints for events.
  - name: Uploads
    description: File upload and storage management endpoints.
  - name: Payments
    description: Payment processing and synchronization endpoints.

