title: ApiBionixSemifinalRoundResponse
type: object
required: [suit, teams]
properties:
  suit:
    type: string
    enum: [hearts, diamonds, clubs, spades]
    example: "hearts"
  teams:
    type: array
    description: "State of all semifinal teams for this suit/lab, ordered by team name."
    items:
      $ref: './ApiBionixSemifinalTeamRoundItem.yaml'
