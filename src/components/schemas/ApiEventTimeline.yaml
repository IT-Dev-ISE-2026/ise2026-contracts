type: object
required: [id, name, date, sequence_order]
properties:
  id:
    type: integer
    example: 1
  name:
    type: string
    example: Pendaftaran Gelombang 1
  date:
    type: string
    format: date-time
    example: "2026-05-01T00:00:00Z"
  sequence_order:
    type: integer
    example: 1
