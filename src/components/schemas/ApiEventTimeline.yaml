title: ApiEventTimeline
type: object
required: [id, slug, name, date]
properties:
  id:
    type: integer
    example: 1
  slug:
    type: string
    example: opreg-1
  name:
    type: string
    example: Pendaftaran Gelombang 1
  date:
    type: string
    format: date-time
    example: "2026-05-01T00:00:00Z"
