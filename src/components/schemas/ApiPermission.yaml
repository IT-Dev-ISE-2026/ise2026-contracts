description: |
  User permissions for attribute-based access control.

  **Penjelasan Akses:**
  * `user`: Akses standar untuk pengguna/peserta reguler.
  * `admin`: Akses admin dasar (*basic admin*).
  * `admin:bionix-competition:read`: Akses untuk melihat data Bionix Competition.
  * `admin:bionix-competition:write`: Akses untuk mengubah/mengelola data Bionix Competition.
  * `admin:bionix-competition:voucher:read`: Akses untuk melihat voucher pada Bionix Competition.
  * `admin:bionix-competition:voucher:write`: Akses untuk mengelola voucher pada Bionix Competition.
  * `admin:bionix-isclass:read`: Akses untuk melihat data Bionix IS Class.
  * `admin:bionix-isclass:write`: Akses untuk mengubah/mengelola data Bionix IS Class.
  * `admin:bionix-isclass:voucher:read`: Akses untuk melihat voucher pada Bionix IS Class.
  * `admin:bionix-isclass:voucher:write`: Akses untuk mengelola voucher pada Bionix IS Class.
  * `admin:rise:read`: Akses untuk melihat data RISE Competition.
  * `admin:rise:write`: Akses untuk mengubah/mengelola data RISE Competition.
  * `admin:rise:voucher:read`: Akses untuk melihat voucher pada RISE Competition.
  * `admin:rise:voucher:write`: Akses untuk mengelola voucher pada RISE Competition.
  * `admin:user:read`: Akses untuk melihat seluruh data pengguna pada sistem.
