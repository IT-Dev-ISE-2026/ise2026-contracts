type: object
required: [id, slug, name, price, isActive, timelines, links]
properties:
  id:
    type: integer
    example: 1
  parentId:
    type: integer
    nullable: true
    example: null
  slug:
    type: string
    example: bionix
  name:
    type: string
    example: Bionix Competition
  price:
    type: integer
    example: 100000
  isActive:
    type: boolean
    example: true
  timelines:
    type: array
    items:
      $ref: './ApiEventTimeline.yaml'
  links:
    type: array
    items:
      $ref: './ApiEventLink.yaml'
  subEvents:
    type: array
    items:
      $ref: './ApiEvent.yaml'
