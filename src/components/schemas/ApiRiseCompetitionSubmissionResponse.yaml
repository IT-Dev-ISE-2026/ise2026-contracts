title: ApiRiseCompetitionSubmissionResponse
type: object
required: [id, stage, fileType, fileUrl, createdAt]
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  stage:
    type: string
    enum: [penyisihan, semifinal, final]
    readOnly: true
  fileType:
    type: string
    enum: [proposal, presentation, rta, executive_summary, paper, pitch_deck]
    readOnly: true
  fileUrl:
    type: string
    format: uri
    readOnly: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
