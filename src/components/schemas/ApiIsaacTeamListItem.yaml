title: ApiIsaacTeamListItem
type: object
required:
  - teamId
  - teamName
  - invitationCode
  - creationSource
  - members
properties:
  teamId:
    type: string
    format: uuid
  teamName:
    type: string
  invitationCode:
    type: string
  creationSource:
    type: string
    enum: [participant, admin]
    description: Indicates whether the team was created through participant registration or by an administrator.
  members:
    type: array
    minItems: 1
    maxItems: 3
    description: Compact team roster ordered with the leader first, followed by members.
    items:
      $ref: './ApiIsaacTeamMemberSummary.yaml'
