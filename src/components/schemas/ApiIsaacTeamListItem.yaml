title: ApiIsaacTeamListItem
type: object
required:
  - teamId
  - teamName
  - invitationCode
  - members
properties:
  teamId:
    type: string
    format: uuid
  teamName:
    type: string
  invitationCode:
    type: string
  members:
    type: array
    minItems: 1
    maxItems: 3
    description: Compact team roster ordered with the leader first, followed by members.
    items:
      $ref: './ApiIsaacTeamMemberSummary.yaml'
