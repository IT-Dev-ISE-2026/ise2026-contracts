type: object
required:
  - id
  - registrationNumber
  - userId
  - registrationType
  - teamRole
  - name
  - email
  - phone
  - institution
  - major
  - studentCardUrl
  - twibbonProofUrl
  - posterProofUrl
  - instagramProofUrl
  - tiktokProofUrl
  - linkedinProofUrl
  - ewalletNumber
  - status
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
  registrationNumber:
    type: integer
    readOnly: true
    description: Permanent registration sequence number for this event. Soft-deleted registrations keep their number, so gaps are expected.
    example: 42
  userId:
    type: string
    format: uuid
  teamId:
    type: string
    format: uuid
    nullable: true
  teamName:
    type: string
    nullable: true
  invitationCode:
    type: string
    nullable: true
  registrationType:
    type: string
    enum: [leader, member, individual]
    readOnly: true
    description: Original registration type selected at registration time. This value is immutable when an admin assigns or removes the participant from a team.
  teamRole:
    type: string
    enum: [leader, member]
    nullable: true
    readOnly: true
    description: Current role inside the assigned team. Null when the participant is not currently assigned to a team.
  name:
    type: string
  email:
    type: string
    format: email
  phone:
    type: string
    minLength: 2
    maxLength: 16
    pattern: '^\+[1-9][0-9]{1,14}$'
    description: Phone number in E.164 format
  institution:
    type: string
  major:
    type: string
  studentCardUrl:
    type: string
  twibbonProofUrl:
    type: string
  posterProofUrl:
    type: string
  instagramProofUrl:
    type: string
  tiktokProofUrl:
    type: string
  linkedinProofUrl:
    type: string
  ewalletNumber:
    type: string
  status:
    type: string
    enum: [pending_payment, pending_review, revision_requested, verified, rejected]
  notes:
    type: string
    nullable: true
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  reviews:
    type: array
    items:
      $ref: './ApiRegistrationReviewResponse.yaml'
    readOnly: true
  order:
    nullable: true
    readOnly: true
    allOf:
      - $ref: './ApiOrderSummary.yaml'
  paymentHistory:
    type: array
    nullable: true
    readOnly: true
    items:
      $ref: './ApiPaymentHistoryItem.yaml'
  registrationHistory:
    type: array
    nullable: true
    readOnly: true
    description: Admin-facing registration timeline. Present on admin detail responses.
    items:
      $ref: './ApiRegistrationHistoryItem.yaml'
