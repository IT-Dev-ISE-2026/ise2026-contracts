title: ApiRiseCompetitionSubmissionRequest
type: object
required:
  - filePath
  - fileType
properties:
  filePath:
    type: string
    description: "The unique storage path/key of the uploaded competition file (starts with temp/)."
    example: "temp/123e4567-e89b-12d3-a456-426614174000.pdf"
  fileType:
    type: string
    enum: [proposal, presentation, rta, executive_summary, paper, pitch_deck]
    description: "The type of the submission file."
    example: "proposal"
