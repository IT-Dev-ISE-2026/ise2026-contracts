type: object
required:
  - id
  - registrationNumber
  - userId
  - registrationType
  - name
  - email
  - phone
  - institution
  - major
  - ewalletNumber
  - status
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
  registrationNumber:
    type: integer
    readOnly: true
    description: Permanent registration sequence number for this event. Soft-deleted registrations keep their number, so gaps are expected.
    example: 42
  userId:
    type: string
    format: uuid
  teamId:
    type: string
    format: uuid
    nullable: true
  teamName:
    type: string
    nullable: true
  invitationCode:
    type: string
    nullable: true
  registrationType:
    type: string
    enum: [leader, member, individual]
  name:
    type: string
  email:
    type: string
    format: email
  phone:
    type: string
  institution:
    type: string
  major:
    type: string
  ewalletNumber:
    type: string
  status:
    type: string
    enum: [pending_payment, pending_review, revision_requested, verified, rejected]
  notes:
    type: string
    nullable: true
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
