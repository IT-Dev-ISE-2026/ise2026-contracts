type: object
required:
  - registrationType
  - name
  - email
  - phone
  - institution
  - studentCardPath
  - twibbonProofPath
  - posterProofPath
  - instagramProofPath
  - tiktokProofPath
  - linkedinProofPath
  - ewalletNumber
  - isAgreed
properties:
  registrationType:
    type: string
    enum: [leader, member, individual]
    description: Original registration type chosen by the participant. The backend must keep this value unchanged when an admin later assigns or removes the participant from a team.
  invitationCode:
    type: string
    description: "Required if registrationType is member."
  teamName:
    type: string
    nullable: true
    minLength: 3
    pattern: '^[\x20-\x7E]+$'
    description: "Optional by schema. Required by business rule when registrationType is leader. Emoji and non-ASCII characters are not allowed."
  name:
    type: string
  email:
    type: string
    format: email
  phone:
    type: string
    minLength: 2
    maxLength: 16
    pattern: '^\+[1-9][0-9]{1,14}$'
    description: Phone number in E.164 format
  institution:
    type: string
  major:
    type: string
    description: "Optional participant major or field of study."
  studentCardPath:
    type: string
    description: "URL path to student card. Must start with temp/"
  twibbonProofPath:
    type: string
    description: "URL path to twibbon proof. Must start with temp/"
  posterProofPath:
    type: string
    description: "URL path to poster proof. Must start with temp/"
  instagramProofPath:
    type: string
    description: "URL path to instagram proof. Must start with temp/"
  tiktokProofPath:
    type: string
    description: "URL path to tiktok proof. Must start with temp/"
  linkedinProofPath:
    type: string
    description: "URL path to linkedin proof. Must start with temp/"
  ewalletNumber:
    type: string
    description: "E-Wallet number for commitment fee refund."
  isAgreed:
    type: boolean
    description: "Must be true. Indicates agreement to terms and conditions."
  voucherCode:
    type: string
    example: "ISEJAYA2026"
    description: "Optional voucher code for discount."
