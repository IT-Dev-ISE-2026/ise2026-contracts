type: object
required:
  - registrationType
  - course
  - name
  - email
  - phone
  - institution
  - major
  - studentCardPath
  - twibbonProofPath
  - posterProofPath
  - instagramProofPath
  - tiktokProofPath
  - linkedinProofPath
  - ewalletNumber
  - isAgreed
properties:
  registrationType:
    type: string
    enum: [leader, member, individual]
    description: "The type of registration."
  course:
    type: string
    enum: [data_science, digital_product]
    description: "The selected course."
  invitationCode:
    type: string
    description: "Required if registrationType is member."
  name:
    type: string
  email:
    type: string
    format: email
  phone:
    type: string
  institution:
    type: string
  major:
    type: string
  studentCardPath:
    type: string
    description: "URL path to student card. Must start with temp/"
  twibbonProofPath:
    type: string
    description: "URL path to twibbon proof. Must start with temp/"
  posterProofPath:
    type: string
    description: "URL path to poster proof. Must start with temp/"
  instagramProofPath:
    type: string
    description: "URL path to instagram proof. Must start with temp/"
  tiktokProofPath:
    type: string
    description: "URL path to tiktok proof. Must start with temp/"
  linkedinProofPath:
    type: string
    description: "URL path to linkedin proof. Must start with temp/"
  ewalletNumber:
    type: string
    description: "E-Wallet number for commitment fee refund."
  isAgreed:
    type: boolean
    description: "Must be true. Indicates agreement to terms and conditions."
