title: ApiBionixIsClassRegistrationAdminListResponse
type: object
required: [id, registrationNumber, userId, name, email, phone, gender, cityId, cityName, schoolName, grade, isAgreed, status, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    example: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
  registrationNumber:
    type: integer
    readOnly: true
    description: Permanent registration sequence number for this event. Soft-deleted registrations keep their number, so gaps are expected.
    example: 42
  userId:
    type: string
    format: uuid
    readOnly: true
    example: "6de1e466-24ba-4475-8495-2aa73b5bd5fb"
  name:
    type: string
    example: "Andi"
  email:
    type: string
    format: email
    example: "andi@gmail.com"
  phone:
    type: string
    minLength: 2
    maxLength: 16
    pattern: '^\+[1-9][0-9]{1,14}$'
    description: Phone number in E.164 format
    example: "+628123456789"
  gender:
    type: string
    enum: [male, female]
    example: male
  cityId:
    type: integer
    example: 1
  cityName:
    type: string
    readOnly: true
    example: "Surabaya"
  schoolName:
    type: string
    example: "SMA Negeri 1 Surabaya"
  grade:
    type: string
    enum: [grade_10, grade_11, grade_12]
    example: grade_12
  isAgreed:
    type: boolean
    example: true
    readOnly: true
  status:
    type: string
    enum: [pending_payment, pending_review, revision_requested, verified, rejected]
    readOnly: true
    example: pending_payment
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: "2026-05-16T08:00:00Z"
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: "2026-05-16T09:00:00Z"
  selectedClassOptionId:
    type: integer
    nullable: true
    readOnly: true
    example: 1
  selectedClassOption:
    nullable: true
    readOnly: true
    allOf:
      - $ref: './ApiBionixIsClassOption.yaml'
  classSelectedAt:
    type: string
    format: date-time
    nullable: true
    readOnly: true
    example: "2026-08-25T10:00:00Z"

