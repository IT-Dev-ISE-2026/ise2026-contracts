title: ApiBionixSemifinalRedoRequest
type: object
required: [registrationId, suit]
properties:
  registrationId:
    type: string
    format: uuid
    example: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
  suit:
    type: string
    enum: [hearts, diamonds, clubs, spades]
    example: "hearts"
  expectedRevision:
    type: integer
    format: int64
    minimum: 0
    description: "Optional. The revision the operator is looking at; the request fails with 409 if the team was changed since."
    example: 7
