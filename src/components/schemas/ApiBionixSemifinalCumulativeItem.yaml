title: ApiBionixSemifinalCumulativeItem
type: object
required: [registrationId, teamName, rank, totalPoints, highestStreak, basePoints, suitPoints, cardsPlayed]
properties:
  registrationId:
    type: string
    format: uuid
    example: "ade1e466-24ba-4475-8495-2aa73b5bd5ff"
  teamName:
    type: string
    example: "Tim Juara IT"
  teamLogo:
    type: string
    nullable: true
    example: "https://api.dicebear.com/7.x/identicon/svg?seed=team1"
  rank:
    type: integer
    example: 1
  totalPoints:
    type: integer
    example: 85
  highestStreak:
    type: integer
    description: "Highest streak reached in any single suit (max across the 4 suits)."
    example: 8
  basePoints:
    type: integer
    example: 79
  suitPoints:
    type: object
    required: [hearts, diamonds, clubs, spades]
    properties:
      hearts:
        type: integer
        example: 25
      diamonds:
        type: integer
        example: 20
      clubs:
        type: integer
        example: 18
      spades:
        type: integer
        example: 22
  cardsPlayed:
    type: integer
    description: "Number of the 56 cards (14 per suit) the team has resolved across all 4 suits. Drives the cumulative progress bar."
    example: 40
