title: ApiIsaacReplaceTeamRequest
type: object
required:
  - leaderRegistrationId
  - member1RegistrationId
  - member2RegistrationId
properties:
  leaderRegistrationId:
    type: string
    format: uuid
    description: Registration ID placed as the team leader. This field cannot be empty. Assignment must not change the participant's original registrationType.
  member1RegistrationId:
    type: string
    format: uuid
    nullable: true
    description: Registration ID placed as the first team member. Send null to remove member 1 from the team. Assignment or removal must not change the original registrationType.
  member2RegistrationId:
    type: string
    format: uuid
    nullable: true
    description: Registration ID placed as the second team member. Send null to remove member 2 from the team. Assignment or removal must not change the original registrationType.
