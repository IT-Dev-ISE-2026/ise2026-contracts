type: object
required:
  - teamName
  - leaderRegistrationId
properties:
  teamName:
    type: string
    description: Name of the team to be created.
  leaderRegistrationId:
    type: string
    format: uuid
    description: Registration ID of an eligible individual registration placed as the team leader. Its original registrationType remains individual.
  member1RegistrationId:
    type: string
    format: uuid
    nullable: true
    description: Registration ID of an eligible individual registration placed as the first team member. Its original registrationType remains individual.
  member2RegistrationId:
    type: string
    format: uuid
    nullable: true
    description: Registration ID of an eligible individual registration placed as the second team member. Its original registrationType remains individual.
