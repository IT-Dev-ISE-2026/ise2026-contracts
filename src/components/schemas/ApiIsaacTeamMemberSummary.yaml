title: ApiIsaacTeamMemberSummary
type: object
required:
  - registrationId
  - userId
  - name
  - email
  - registrationType
  - teamRole
  - status
properties:
  registrationId:
    type: string
    format: uuid
    description: ISAAC registration ID used when updating team assignments.
  userId:
    type: string
    format: uuid
  name:
    type: string
  email:
    type: string
    format: email
  registrationType:
    type: string
    enum: [leader, member, individual]
    description: Original immutable registration type.
  teamRole:
    type: string
    enum: [leader, member]
    description: Current role of this participant in the team.
  status:
    type: string
    enum: [pending_payment, pending_review, revision_requested, verified, rejected]
