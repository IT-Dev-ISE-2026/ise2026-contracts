name: Bundle OpenAPI Spec

on:
  push:
    branches: [main]

jobs:
  bundle-and-commit:
    name: Bundle and Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle OpenAPI spec
        run: pnpm run bundle

      - name: Commit and Push dist/openapi.yaml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bundle openapi spec [skip ci]"
          file_pattern: 'dist/openapi.yaml'
          branch: main

  semantic-release:
    name: Semantic Release
    needs: bundle-and-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [semantic-release, bundle-and-commit]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle OpenAPI spec
        run: pnpm run bundle

      - name: Upload to GitHub Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-release.outputs.new_release_version }}
          name: v${{ needs.semantic-release.outputs.new_release_version }}
          body: |
            Auto-generated OpenAPI bundle for version v${{ needs.semantic-release.outputs.new_release_version }}.
            Commit: ${{ github.sha }}
          files: dist/openapi.yaml
          make_latest: true

      - name: Update Latest Release Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest OpenAPI Spec
          body: |
            Latest stable OpenAPI bundle.
            Current version: v${{ needs.semantic-release.outputs.new_release_version }}
          files: dist/openapi.yaml
          make_latest: false

  notify:
    needs: [semantic-release, publish-release]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook Notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"content\": \"Contracts have been updated to **v${{ needs.semantic-release.outputs.new_release_version }}**. Don't forget to sync your local OpenAPI spec. <@&${{ secrets.BACKEND_ROLE_ID }}> <@&${{ secrets.FRONTEND_ROLE_ID }}>\n\n**Repository:** ${{ github.repository }}\n**Commit:** ${{ github.sha }}\n**Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ needs.semantic-release.outputs.new_release_version }}\"}" \
          $WEBHOOK_URL
