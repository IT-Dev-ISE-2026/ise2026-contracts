# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: MineBartekSA/discord-webhook@v2
        with:
          webhook: ${{ secrets.WEBHOOK_URL }}
          content: "Contracts have been updated to **vX.X.X**! <@&${{ secrets.BACKEND_ROLE_ID }}> <@&${{ secrets.FRONTEND_ROLE_ID }}>"
          embed: |
            title: "📜 OpenAPI Contracts Updated"
            description: "New version **vX.X.X** is now available. Don't forget to sync your local OpenAPI spec."
            color: 15844367
